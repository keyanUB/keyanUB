name: Update daily quote preview

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-daily-quote.yml
      - .github/scripts/update-daily-quote.js

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README quote preview
        run: node .github/scripts/update-daily-quote.js

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "Daily quote preview already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update daily quote preview"
          git push
